services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: tau-bisim-audit:latest
    environment:
      PORT: "8080"
    ports:
      # 宿主机端口可通过环境变量 HOST_PORT 配置，默认 8080
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  verify:
    build:
      context: .
      dockerfile: Dockerfile
    image: tau-bisim-audit:latest
    environment:
      BASE_URL: "http://web:8080"
    depends_on:
      web:
        condition: service_healthy
    # 构建检查 + 代码测试 + 接口/HTTP 冒烟，完成即退出并以退出码报告结果：
    #   docker compose run --build verify
    # 或随编排一并运行：
    #   docker compose up --build --abort-on-container-exit --exit-code-from verify
    entrypoint: ["sh", "scripts/verify.sh"]
    restart: "no"
